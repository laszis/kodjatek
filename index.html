<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Üsd be a kódot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090909;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      width: min(90%, 500px);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: -1px;
    }

    input {
      width: 100%;
      padding: 17px 20px;
      border: 1px solid #333;
      border-radius: 12px;
      outline: none;
      background: #151515;
      color: white;
      font-size: 18px;
      text-align: center;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #666;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    button {
      margin-top: 14px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #090909;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #ddd;
    }

    #message {
      min-height: 28px;
      margin-top: 22px;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      color: #ff4545;
    }

    .success {
      color: #35e875;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 16px;
      top: -30px;
      z-index: 10;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          translateX(var(--drift))
          rotate(720deg);
        opacity: 0;
      }
    }

    /* Small glow when correct */
    .party {
      animation: partyPulse 0.6s ease;
    }

    @keyframes partyPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="container" id="container">
    <h1>Üsd be a kódot</h1>

    <input
      id="codeInput"
      type="text"
      placeholder="Írd be a kódot..."
      autocomplete="off"
    />

    <button id="submitButton">Ellenőrzés</button>

    <div id="message"></div>
  </main>

  <script>
    // ==========================
    // BEÁLLÍTÁSOK
    // ==========================

    const CORRECT_CODE = "957";
    const NEXT_CODE = "Fatároló";


    // ==========================
    // ELEMEK
    // ==========================

    const input = document.getElementById("codeInput");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const container = document.getElementById("container");


    // ==========================
    // KÓD ELLENŐRZÉSE
    // ==========================

    function checkCode() {
      const enteredCode = input.value.trim();

      if (enteredCode === CORRECT_CODE) {
        message.textContent = `Helyes! A következő állomás: ${NEXT_CODE}`;
        message.className = "success";

        container.classList.remove("party");

        // Restart animation
        void container.offsetWidth;

        container.classList.add("party");

        createConfetti();
      } else {
        message.textContent = "Helytelen, próbáld újra.";
        message.className = "error";
      }
    }


    // ==========================
    // ENTER BILLENTYŰ
    // ==========================

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        checkCode();
      }
    });

    button.addEventListener("click", checkCode);


    // ==========================
    // PARTY ANIMÁCIÓ
    // ==========================

    function createConfetti() {
      const colors = [
        "#ff4d4d",
        "#35e875",
        "#4da6ff",
        "#ffd84d",
        "#c44dff",
        "#ff7ac8",
        "#ffffff"
      ];

      const amount = 120;

      for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");

        piece.classList.add("confetti");

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDuration =
          2.5 + Math.random() * 2.5 + "s";

        piece.style.animationDelay =
          Math.random() * 0.5 + "s";

        piece.style.setProperty(
          "--drift",
          (Math.random() * 300 - 150) + "px"
        );

        piece.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 6000);
      }
    }
  </script>

</body>
</html>
